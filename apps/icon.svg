<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Underwater Recovery Studio app icon. The lens: left half as the camera
       saw it (blue-green water), right half recovered (warm reef colour).
       apps/render-icons.mjs renders every size the apps need from this. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3b5c"/>
      <stop offset="1" stop-color="#06121f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2bb3c0"/>
      <stop offset="1" stop-color="#0b4f6c"/>
    </linearGradient>
    <linearGradient id="reef" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff6b5b"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="512" cy="512" r="262"/></clipPath>
  </defs>
  <g id="plate"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/></g>
  <g id="mark">
    <g clip-path="url(#lens)">
      <rect x="250" y="250" width="262" height="524" fill="url(#water)"/>
      <rect x="512" y="250" width="262" height="524" fill="url(#reef)"/>
      <path d="M240 560 C 320 505, 400 505, 480 560 S 640 615, 720 560 S 800 505, 800 540 L 800 800 L 240 800 Z" fill="#06121f" opacity="0.28"/>
      <path d="M240 560 C 320 505, 400 505, 480 560 S 640 615, 720 560 S 800 505, 800 540" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
    </g>
    <circle cx="512" cy="512" r="262" fill="none" stroke="#e8f6ff" stroke-width="30"/>
    <line x1="512" y1="250" x2="512" y2="774" stroke="#e8f6ff" stroke-width="10" opacity="0.9"/>
  </g>
</svg>
