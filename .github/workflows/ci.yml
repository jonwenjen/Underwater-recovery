name: CI

# pages.yml only runs on pushes to main, so nothing caught a broken pipeline
# until it was already deployed. This gates every push and pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      # src + test + bench. The pipeline tests are the regression guard for
      # white-clipping, banding and the no-op path, so a type error in test/
      # means a real guard is broken.
      - name: Typecheck
        run: npm run typecheck

      - name: Pipeline tests
        run: npm test

      - name: Production build
        run: npm run build

      # The video e2e drives a headless Chrome, which is available on the
      # ubuntu runner. It runs against the real production build and the
      # committed fixture clip (which carries an AAC audio track, so this also
      # covers audio passthrough).
      - name: Video end-to-end
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:4173/Underwater-recovery/ > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:4173/Underwater-recovery/ > /dev/null \
            || { echo "preview server never came up"; exit 1; }
          node scripts/e2e-video.mjs \
            http://localhost:4173/Underwater-recovery/ \
            test/fixtures/underwater.mp4 \
            /tmp/exported.mp4
