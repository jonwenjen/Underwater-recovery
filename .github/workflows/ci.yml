name: CI

# pages.yml only runs on pushes to main, so nothing caught a broken pipeline
# until it was already deployed. This gates every push and pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      # src + test + bench, so a type error in a test is caught as a broken guard
      - name: Typecheck
        run: npm run typecheck

      - name: Engine tests (Studio)
        run: npm test

      # The v1 CPU pipeline is no longer served but stays in the tree; its
      # regression guards (white clipping, banding, no-op path) keep running.
      - name: Legacy pipeline tests (v1)
        run: npm run test:legacy

      - name: Production build
        run: npm run build

  verify:
    # End-to-end on the real production build in headless Chromium: WebGL2
    # (SwiftShader) + WebCodecs (VP9), ground-truth photo and video scenes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-output
          path: verify-output
